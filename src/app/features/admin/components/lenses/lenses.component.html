<!-- ==================================
    Body
=================================== -->

<div class="lenses-wrapper">

    <div class="lenses-wrapper__table-header">
        <h2>Linser</h2>
        <button (click)="openModal(addModal)">Ny Lins</button>
    </div>

    <table>
        <thead>
            <tr>
                <th class="lenses-wrapper__lens-type">Typ</th>
                <th class="lenses-wrapper__lens-name">Linsnamn</th>
                <th class="lenses-wrapper__lens-quality">Kvalité</th>
                <th class="lenses-wrapper__lens-manufacturing-type">Tillverknings Typ</th>
                <th class="lenses-wrapper__lens-index-price">Index Pris</th>
                <th class="lenses-wrapper__lens-edit"></th>
                <th class="lenses-wrapper__lens-delete"></th>
            </tr>
        </thead>
        <!-- The table body will be populated by main.js -->
        <tbody id="lenses-wrapper__lens_data">
            <tr *ngFor="let lense of lenses">
                <td>{{ lense.type }}</td>
                <td>{{ lense.name }}</td>
                <td>{{ lense.quality }}</td>
                <td>{{ lense.manufacturingType }}</td>
                <td>{{ lense.indexPrices }}</td>
                <td><button (click)="openModal(editModal, lense.name, lense.quality)" class="lenses-wrapper__edit-btn">Edit</button></td>
                <td><button (click)="deleteLens(lense.name, lense.quality)" class="lenses-wrapper__delete-btn">Delete</button></td>
            </tr>
        </tbody>
    </table>

</div>

<!-- ==================================
    Modals
=================================== -->

<!-- Edit Modal -->

<dialog class="modal" #editModal>
    <button class="close-modal" (click)="closeModal(editModal)">Stäng</button>

    <form (ngSubmit)="updateLens(lense, editModal)">
        <h3>{{ lense.name }}</h3>

        <label for="edit-type">Typ</label>
        <select name="type" id="edit-type" [(ngModel)]="lense.type">
            <option class="hidden-option" disabled selected></option>
            <option>Progressiva</option>
            <option>Enkelslipade</option>
        </select>

        <label for="edit-name">Namn</label>
        <input type="text" name="name" id="edit-name" [(ngModel)]='lense.name'>

        <label for="edit-quality">Kvalité</label>
        <select name="quality" id="edit-quality" [(ngModel)]="lense.quality">
            <option class="hidden-option" disabled selected></option>
            <option value="7">7</option>
            <option value="6">6</option>
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
            <option value="0.5">0.5</option>
        </select>

        <label for="edit-manufacturingType">Tillverknings Typ</label>
        <select name="manufacturingType" id="edit-manufacturingType" [(ngModel)]="lense.manufacturingType">
            <option class="hidden-option" disabled selected></option>
            <option>RX</option>
            <option>Stock</option>
        </select>

        <fieldset class="strengths-fieldset">
            <legend>Styrkor</legend>

            <div class="input-wrapper">
                <label for="edit-prism">Prisma</label>
                <input type="number" min="0" name="prism" id="edit-prism" [(ngModel)]="lense.staticCorrectionDetails.prism">
            </div>

            <div class="input-wrapper">
                <label for="edit-addition-min">Addition min</label>
                <input type="number" min="0" name="addition-min" id="edit-addition-min" [(ngModel)]="lense.staticCorrectionDetails.addition.min">
            </div>

            <div class="input-wrapper">
                <label for="edit-addition-max">Addition max</label>
                <input type="number" min="0" name="addition-max" id="edit-addition-max" [(ngModel)]="lense.staticCorrectionDetails.addition.max">
            </div>
        </fieldset>

        <button type="submit" class="save-lens">Spara</button>
    </form>

</dialog>

<!-- Add Modal -->

<dialog class="modal" #addModal>
    <button class="close-modal" (click)="closeModal(addModal)">Stäng</button>

    <form #form="ngForm" (ngSubmit)="addLens(form)">
        <h3>Fyll i alla fält</h3>

        <!-- ================================
            General
        ================================= -->

        <label for="type">Typ</label>
        <select name="type" id="type" required [(ngModel)]="lense.type" #type="ngModel" class="form-control" [ngClass]="{ 'is-invalid': type.invalid && type.touched }">
            <option class="hidden-option" disabled selected></option>
            <option>Progressiva</option>
            <option>Enkelslipade</option>
        </select>

        <label for="name">Namn</label>
        <input type="text" autocomplete="off" name="name" id="name" required [(ngModel)]="lense.name"
        #name="ngModel" class="form-control" [ngClass]="{ 'is-invalid': name.invalid && name.touched }">

        <label for="quality">Kvalité</label>
        <select name="quality" id="quality" required [(ngModel)]="lense.quality" #quality="ngModel" class="form-control" [ngClass]="{ 'is-invalid': quality.invalid && quality.touched }">
            <option class="hidden-option" disabled selected></option>
            <option value="7">7</option>
            <option value="6">6</option>
            <option value="5">5</option>
            <option value="4">4</option>
            <option value="3">3</option>
            <option value="2">2</option>
            <option value="1">1</option>
            <option value="0.5">0.5</option>
        </select>

        <label for="manufacturingType">Tillverknings Typ</label>
        <select name="manufacturingType" id="manufacturingType" required [(ngModel)]="lense.manufacturingType" #manufacturingType="ngModel" class="form-control" [ngClass]="{ 'is-invalid': manufacturingType.invalid && manufacturingType.touched }">
            <option class="hidden-option" disabled selected></option>
            <option>RX</option>
            <option>Stock</option>
        </select>

        <!-- ================================
            Treatment
        ================================= -->

        <fieldset class="treatment-fieldset">
            <!-- TODO: need some extra doings in js, should be added to an array -->
            <legend>Behandling</legend>
            <select name="treatment" id="treatment" required [(ngModel)]="lense.treatment" #treatment="ngModel" class="form-control" [ngClass]="{ 'is-invalid': treatment.invalid && treatment.touched }">
                <option class="hidden-option" disabled selected></option>
                <option>CSP + UV</option>
                <option>CEP</option>
                <option>HMC+</option>
                <option value="x">Ingen behandling</option>
            </select>

            <fieldset class="eps-fieldset"  [ngClass]="{ 'is-invalid': submitted && eps.invalid }">
                <legend>Eye Protection System</legend>

                <input type="radio" name="eps" id="eps-yes" value="yes" required [(ngModel)]="eps" #eps="ngModel" class="form-control">
                <label for="eps-yes">Ja</label>

                <input type="radio" name="eps" id="eps-no" value="no" required [(ngModel)]="eps" class="form-control">
                <label for="eps-no">Nej</label>

            </fieldset>
        </fieldset>

        <!-- ================================
            Strengths
        ================================= -->

        <fieldset class="strengths-fieldset">
            <legend>Styrkor</legend>

            <div class="input-wrapper">
                <label for="prism">Prisma</label>
                <input #input type="number" min="0" name="prism" id="prism" required [(ngModel)]="lense.staticCorrectionDetails.prism" #prism="ngModel" class="form-control" [ngClass]="{ 'is-invalid': prism.invalid && prism.touched }">
            </div>

            <div class="input-wrapper">
                <label for="addition-min">Addition min</label>
                <input #input type="number" step="0.01" min="0" name="addition-min" id="addition-min" required [(ngModel)]="lense.staticCorrectionDetails.addition.min" #additionMin="ngModel" class="form-control" [ngClass]="{ 'is-invalid': additionMin.invalid && additionMin.touched }">
            </div>

            <div class="input-wrapper">
                <label for="addition-max">Addition max</label>
                <input #input type="number" step="0.01" min="0" name="addition-max" id="addition-max" required [(ngModel)]="lense.staticCorrectionDetails.addition.max" #additionMax="ngModel" class="form-control" [ngClass]="{ 'is-invalid': additionMax.invalid && additionMax.touched }">
            </div>
        </fieldset>

        <!-- ================================
            Index prices
        ================================= -->

        <fieldset id="index-required" class="index-fieldset">
            <legend>Fyll i pris(erna) för glasets index</legend>

            <div class="input-wrapper">
                <label for="index-1.74" data-value="Lineis">1.74</label>
                <input type="number" name="index-1.74" id="index-1.74">
            </div>

            <div class="input-wrapper">
                <label for="index-1.67" data-value="Stylis">1.67</label>
                <input type="number" name="index-1.67" id="index-1.67">
            </div>

            <div class="input-wrapper">
                <label for="index-1.6" data-value="Ormix">1.6</label>
                <input type="number" name="index-1.6" id="index-1.6">
            </div>

            <div class="input-wrapper">
                <label for="index-1.5-orma" data-value="Orma">1.5 (orma)</label>
                <input type="number" name="index-1.5-orma" id="index-1.5-orma">
            </div>

            <div class="input-wrapper">
                <label for="index-1.5-organic" data-value="Organic">1.5 (organic)</label>
                <input type="number" name="index-1.5-organic" id="index-1.5-organic">
            </div>
        </fieldset>

        <button type="submit" class="add-btn" [ngClass]="{ 'invalid-add-btn': form.invalid }">{{ form.invalid ? 'Fyll i alla fält' : 'Lägg Till' }}</button>
    </form>
</dialog>
