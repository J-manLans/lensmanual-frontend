<article class="glasses glasses--prog">

  <div class="glasses__prefix">
    <h2 id="progressiva" class="glasses__title">Progressiva glas</h2>

    <div class="glasses__additions">
      <ul>
        <app-shared-glass-info-prefix></app-shared-glass-info-prefix>
      </ul>
    </div>

  </div>

  <table>
    <thead>
        <tr>
            <th class="table-wrapper__lens-type">Typ</th>
            <th class="table-wrapper__lens-name">Linsnamn</th>
            <th class="table-wrapper__lens-quality">Kvalité</th>
            <th class="table-wrapper__lens-manufacturing-type">Tillverknings Typ</th>
            <th class="table-wrapper__lens-index-price">Index Pris</th>
            <th class="table-wrapper__lens-edit"><em>Behandling</em></th>
        </tr>
    </thead>
    <!-- The table body will be populated by main.js -->
    <tbody id="table-wrapper__lens_data">
        <tr *ngFor="let lense of lenses">
          <ng-container *ngIf="lense.type === 'Progressiva'">
            <td>{{ lense.type }}</td>
            <td>{{ lense.name }}</td>
            <td>{{ lense.quality }}</td>
            <td>{{ lense.manufacturingType }}</td>
            <td>{{ lense.indexPrices }}</td>
            <td>{{ lense.treatment }}</td>

          </ng-container>
        </tr>
    </tbody>
</table>

</article>
